[project]
name = "hypatia-backend"
version = "0.1.0"
description = "Hypatia FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "anthropic>=0.30,<1.0",
    "openai>=1.30,<2.0",
    "httpx>=0.27,<1.0",
    "github-copilot-sdk>=1.0.9,<2.0",
    "structlog>=24.0,<25.0",
    "tiktoken>=0.7,<1.0",
    "keyring>=25.0,<26.0",
    "markitdown[pdf,docx,pptx,xlsx]>=0.0.1a3,<1.0",
    "numpy<2.5",
    "faster-whisper>=1.0,<2.0",
    "types-PyYAML>=6.0"
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2.0"]
dev = [
    "uv>=0.4,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real LLM API key; excluded from the fast CI test run",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
