name: Nightly

on:
  schedule:
    # 07:00 UTC every day
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  integration-tests:
    name: Integration tests (real LLM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Test API key stored as a repository secret — never committed to code.
      TEST_LLM_API_KEY: ${{ secrets.TEST_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: pytest (integration tests)
        run: |
          set +e
          pytest tests/ -m integration -v
          code=$?
          # Exit code 5 = "no tests collected". No integration tests exist yet
          # in Phase 1 scaffolding, so treat that as a no-op rather than a failure.
          if [ "$code" -eq 5 ]; then
            echo "No integration tests collected yet."
            exit 0
          fi
          exit "$code"

      - name: Prompt regression tests against golden corpus
        run: |
          if [ -d tests/golden_corpus ]; then
            pytest tests/golden_corpus -v
          else
            echo "Golden corpus not yet implemented (see Phase 3B.10); skipping."
          fi
