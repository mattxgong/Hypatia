name: Manual

on:
  workflow_dispatch: {}

jobs:
  cross-platform-build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: build/windows/x64/runner/Release
          - os: macos-latest
            target: macos
            artifact: build/macos/Build/Products/Release
          - os: ubuntu-latest
            target: linux
            artifact: build/linux/x64/release/bundle
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Enable ${{ matrix.target }} desktop support
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build ${{ matrix.target }}
        run: flutter build ${{ matrix.target }}

      - name: Bundle backend runtime
        shell: pwsh
        run: |
          $artifactDir = Join-Path $PWD '${{ matrix.artifact }}'
          $repoRoot = Resolve-Path (Join-Path $PWD '..')
          $backendSource = Resolve-Path (Join-Path $PWD '..' 'backend')
          $backendTarget = Join-Path $artifactDir 'backend'

          Remove-Item $backendTarget -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $backendTarget -ItemType Directory -Force | Out-Null

          @(
            'app'
            'alembic'
            'alembic.ini'
            'pyproject.toml'
            'requirements.txt'
            'requirements.lock'
          ) | ForEach-Object {
            Copy-Item (Join-Path $backendSource $_) $backendTarget -Recurse -Force
          }

          @('LICENSE', 'NOTICE') | ForEach-Object {
            Copy-Item (Join-Path $repoRoot $_) $artifactDir -Force
          }

      - name: Verify packaged application
        shell: pwsh
        run: |
          $artifactDir = Join-Path $PWD '${{ matrix.artifact }}'
          $backendDir = Join-Path $artifactDir 'backend'
          @(
            'app/main.py'
            'alembic/env.py'
            'alembic.ini'
            'pyproject.toml'
            'requirements.txt'
            'requirements.lock'
          ) | ForEach-Object {
            $requiredPath = Join-Path $backendDir $_
            if (-not (Test-Path $requiredPath -PathType Leaf)) {
              throw "Packaged backend is missing required file: $requiredPath"
            }
          }

          @('LICENSE', 'NOTICE') | ForEach-Object {
            $requiredPath = Join-Path $artifactDir $_
            if (-not (Test-Path $requiredPath -PathType Leaf)) {
              throw "Packaged artifact is missing required file: $requiredPath"
            }
          }

          $dependencyNotices = @(
            Get-ChildItem $artifactDir -Recurse -File |
              Where-Object {
                $_.Name -in @('NOTICES', 'NOTICES.Z') -and $_.Length -gt 0
              }
          )
          if ($dependencyNotices.Count -eq 0) {
            throw 'Packaged artifact is missing Flutter dependency notices.'
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypatia-${{ matrix.target }}
          path: frontend/${{ matrix.artifact }}

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run E2E tests
        run: pytest tests/e2e/ -v
