name: Manual

on:
  workflow_dispatch: {}

jobs:
  cross-platform-build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Enable ${{ matrix.target }} desktop support
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build ${{ matrix.target }}
        run: flutter build ${{ matrix.target }}

  full-e2e:
    name: Full E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run full E2E suite
        run: |
          if [ -d e2e ]; then
            echo "Run the Phase 8 E2E suite here."
          else
            echo "Full E2E suite not yet implemented (see Phase 8); skipping."
          fi
