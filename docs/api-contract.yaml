openapi: 3.0.3
info:
  title: Hypatia Backend API
  description: >
    Contract between the Flutter frontend and the FastAPI backend for the
    Hypatia LLM wiki application. Covers health, Classes CRUD, file
    upload/serve/delete, wiki tree/page CRUD/search/export/lint/rebuild,
    chat WebSocket + history, task status, settings, and class backup/import.
  version: "0.4.0"
servers:
  - url: http://127.0.0.1:8000
    description: >-
      Local dev backend. Port may vary 8000-8010 if 8000 is taken
      (see Task 1.9 auto-launch/port management).

paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Backend is up and ready to accept requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  /api/classes:
    get:
      summary: List all Classes
      operationId: listClasses
      responses:
        "200":
          description: All Classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassRead"
    post:
      summary: Create a new Class
      operationId: createClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassCreate"
      responses:
        "201":
          description: Class created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassRead"

  /api/classes/{class_id}:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    get:
      summary: Get a single Class
      operationId: getClass
      responses:
        "200":
          description: Class details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassRead"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update a Class's name/description
      operationId: updateClass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassUpdate"
      responses:
        "200":
          description: Updated Class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassRead"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a Class and all its data
      operationId: deleteClass
      responses:
        "204":
          description: Class deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/classes/{class_id}/files:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    get:
      summary: List all files in a Class
      operationId: listFiles
      responses:
        "200":
          description: Files in this Class
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileRead"
    post:
      summary: Upload one or more files to a Class
      operationId: uploadFiles
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required: [files]
      responses:
        "202":
          description: Files accepted; conversion/processing runs asynchronously
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileUploadResponse"
        "400":
          description: A file name is empty or reduces to no usable name
        "409":
          description: >-
            A file name repeats within the request or already exists in this
            Class. Names must be unique per Class; nothing in the batch is stored.
        "413":
          description: A file exceeds the upload size limit; nothing in the batch is stored

  /api/classes/{class_id}/files/{file_id}:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/FileId"
    get:
      summary: Get a single file's status/details
      operationId: getFile
      responses:
        "200":
          description: File details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRead"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a file, cancel any in-flight conversion or ingestion, and clean up the wiki
      operationId: deleteFile
      responses:
        "204":
          description: File deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/classes/{class_id}/files/{file_id}/raw:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/FileId"
    get:
      summary: Serve the raw uploaded file
      operationId: getFileRaw
      responses:
        "200":
          description: Raw file content
          content:
            application/octet-stream: {}
        "404":
          $ref: "#/components/responses/NotFound"

  /api/classes/{class_id}/files/{file_id}/converted:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/FileId"
    get:
      summary: Serve the converted markdown version
      operationId: getFileConverted
      responses:
        "200":
          description: Converted markdown content
          content:
            text/markdown: {}
        "404":
          $ref: "#/components/responses/NotFound"

  /api/classes/{class_id}/files/{file_id}/open:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/FileId"
    get:
      summary: Deep-link to file with Location header for frontend navigation
      operationId: openFile
      responses:
        "200":
          description: File metadata with optional Location header
          headers:
            Location:
              schema:
                type: string
              description: URI for the file's converted content if available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRead"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/classes/{class_id}/wiki/tree:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    get:
      summary: Get the wiki page tree structure for the sidebar
      operationId: getWikiTree
      responses:
        "200":
          description: Flat list of wiki page summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiTreeNode"

  /api/classes/{class_id}/wiki/index:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    get:
      summary: Get the wiki index page content
      operationId: getWikiIndex
      responses:
        "200":
          description: Index page content (empty string if no index exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
                required: [content]

  /api/classes/{class_id}/wiki/pages/{page_path}:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - name: page_path
        in: path
        required: true
        schema:
          type: string
        description: Slash-separated relative path to the wiki page
    get:
      summary: Get a wiki page
      operationId: getWikiPage
      responses:
        "200":
          description: Wiki page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiPageRead"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Update a wiki page (user edit)
      operationId: updateWikiPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WikiPageUpdate"
      responses:
        "200":
          description: Updated wiki page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiPageRead"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/classes/{class_id}/wiki/search:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    get:
      summary: Full-text search wiki pages
      operationId: searchWiki
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiSearchResult"

  /api/classes/{class_id}/wiki/export:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    post:
      summary: Export all wiki pages as a ZIP
      operationId: exportWiki
      responses:
        "200":
          description: ZIP file containing wiki pages
          content:
            application/zip: {}
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/classes/{class_id}/wiki/lint:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    post:
      summary: Run LLM-powered lint on wiki pages
      operationId: lintWiki
      responses:
        "200":
          description: Lint report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LintReport"
        "503":
          $ref: "#/components/responses/LLMUnavailable"

  /api/classes/{class_id}/wiki/rebuild:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    post:
      summary: Rebuild the wiki (preview or confirm)
      operationId: rebuildWiki
      parameters:
        - name: confirm
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: >-
            Without confirm: rebuild preview. With confirm: task started.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RebuildPreview"
                  - $ref: "#/components/schemas/TaskStarted"
        "503":
          $ref: "#/components/responses/LLMUnavailable"

  /api/classes/{class_id}/chat:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    get:
      summary: >-
        WebSocket chat connection (OpenAPI 3.0 has no native WebSocket
        support). See ChatWs* schemas for message formats.
      operationId: chatWebSocket
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)

  /api/classes/{class_id}/chat/history:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    get:
      summary: Get paginated chat history
      operationId: getChatHistory
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Chat messages (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessageRead"
    delete:
      summary: Clear chat history for a Class
      operationId: clearChatHistory
      responses:
        "204":
          description: Chat history cleared

  /api/classes/{class_id}/backup:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    post:
      summary: Export a Class as a backup ZIP
      operationId: backupClass
      responses:
        "200":
          description: Backup ZIP file
          content:
            application/zip: {}
        "404":
          $ref: "#/components/responses/NotFound"

  /api/classes/import:
    post:
      summary: Import a Class from a backup ZIP
      operationId: importClass
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Class imported successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/settings:
    get:
      summary: Get application settings
      description: >-
        Returns persisted non-secret settings. Configured credentials are
        represented by masked values and are never returned in full.
      operationId: getSettings
      responses:
        "200":
          description: Current application settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsRead"
    put:
      summary: Update application settings
      description: >-
        Updates only supplied fields. Omit a credential to preserve it, or
        send an empty string to delete the stored credential.
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated application settings with credentials masked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsRead"
        "422":
          description: Invalid provider, value, or request shape

  /api/settings/validate-key:
    post:
      summary: Test a provider connection
      description: >-
        Sends a small completion through a temporary provider built from the
        saved settings plus any unsaved overrides in the request. A failed
        connection returns HTTP 200 with valid set to false.
      operationId: validateProviderKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateKeyRequest"
      responses:
        "200":
          description: Credential validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateKeyResponse"
        "422":
          description: Unsupported provider or invalid request shape

  /api/settings/usage:
    get:
      summary: Get in-memory LLM token usage
      operationId: getSettingsUsage
      responses:
        "200":
          description: Token and request totals since the backend started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageTotals"

  /api/settings/ollama-models:
    get:
      summary: List models installed on the configured Ollama server
      operationId: listOllamaModels
      responses:
        "200":
          description: Sorted Ollama model names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "502":
          description: The configured Ollama server could not be reached

  /api/settings/unload-ollama:
    post:
      summary: Unload the active Ollama model
      description: >-
        Requests immediate model eviction for an Ollama-backed provider. A
        false result also covers non-Ollama providers and failed unloads.
      operationId: unloadOllamaModel
      responses:
        "200":
          description: Ollama unload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaUnloadResponse"

  /api/tasks:
    get:
      summary: List all background tasks
      operationId: listTasks
      responses:
        "200":
          description: All tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskStatus"

  /api/tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a task's status
      operationId: getTask
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tasks/{task_id}/cancel:
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Cancel a running task
      operationId: cancelTask
      responses:
        "202":
          description: Cancellation requested
        "404":
          $ref: "#/components/responses/NotFound"

  /api/classes/{class_id}/decks:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    get:
      summary: List flashcard decks with card, due, and out-of-date counts
      operationId: listDecks
      responses:
        "200":
          description: Decks, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeckRead"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: Create an empty deck for user-written cards
      operationId: createDeck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckCreate"
      responses:
        "201":
          description: Created deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckRead"

  /api/classes/{class_id}/decks/generate:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    post:
      summary: Generate a deck from wiki pages
      description: >-
        method heuristic builds the deck immediately (201). llm and hybrid
        first check that the LLM is reachable, then run as a background task
        (202); poll /api/tasks/{task_id}, whose result holds the new deck id.
      operationId: generateDeck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckGenerateRequest"
      responses:
        "201":
          description: Generated deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckRead"
        "202":
          description: AI generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyTaskStarted"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >-
            Invalid request, or no cards could be extracted from the scope
            (code VALIDATION_ERROR with a user_action hint).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LLMUnavailable"

  /api/classes/{class_id}/decks/{deck_id}:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/DeckId"
    get:
      summary: Get a deck
      operationId: getDeck
      responses:
        "200":
          description: Deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckRead"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Rename a deck or change its description
      operationId: updateDeck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckUpdate"
      responses:
        "200":
          description: Updated deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckRead"
    delete:
      summary: Delete a deck and its cards
      operationId: deleteDeck
      responses:
        "204":
          description: Deleted

  /api/classes/{class_id}/decks/{deck_id}/refresh:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/DeckId"
    post:
      summary: Re-extract out-of-date generated cards from the current wiki pages
      description: >-
        Cards whose front still appears keep their review history and get the
        new back; generated cards that no longer appear are removed. User
        cards are left for the user to edit or acknowledge.
      operationId: refreshDeck
      responses:
        "200":
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckRefreshResponse"

  /api/classes/{class_id}/decks/{deck_id}/export:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/DeckId"
      - name: format
        in: query
        schema:
          type: string
          enum: [csv, anki]
          default: csv
    get:
      summary: Export a deck as generic CSV or an Anki-importable TSV
      operationId: exportDeck
      responses:
        "200":
          description: Attachment (`.csv` or `.anki.txt` with Anki file headers)
          content:
            text/csv:
              schema:
                type: string
            text/plain:
              schema:
                type: string

  /api/classes/{class_id}/decks/{deck_id}/cards:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/DeckId"
    get:
      summary: List a deck's cards
      operationId: listCards
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlashcardRead"
    post:
      summary: Add a user-written card
      operationId: createCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardCreate"
      responses:
        "201":
          description: Created card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardRead"

  /api/classes/{class_id}/decks/{deck_id}/due:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/DeckId"
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 20
    get:
      summary: Cards due for review, most overdue first
      operationId: listDueCards
      responses:
        "200":
          description: Due cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlashcardRead"

  /api/classes/{class_id}/decks/{deck_id}/cards/{card_id}:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/DeckId"
      - $ref: "#/components/parameters/CardId"
    patch:
      summary: Edit a card or accept its changed wiki pages
      operationId: updateCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlashcardUpdate"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardRead"
    delete:
      summary: Delete a card
      operationId: deleteCard
      responses:
        "204":
          description: Deleted

  /api/classes/{class_id}/decks/{deck_id}/cards/{card_id}/review:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/DeckId"
      - $ref: "#/components/parameters/CardId"
    post:
      summary: Record a review and reschedule the card (SM-2)
      operationId: reviewCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: string
                  enum: [again, hard, good, easy]
              required: [rating]
      responses:
        "200":
          description: Rescheduled card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashcardRead"

  /api/classes/{class_id}/quizzes:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    get:
      summary: List practice quizzes
      operationId: listQuizzes
      responses:
        "200":
          description: Quizzes, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizSummaryRead"

  /api/classes/{class_id}/quizzes/generate:
    parameters:
      - $ref: "#/components/parameters/ClassId"
    post:
      summary: Generate a practice quiz from wiki pages
      description: >-
        Same 201/202 behaviour as deck generation. short questions need
        method llm or hybrid.
      operationId: generateQuiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizGenerateRequest"
      responses:
        "201":
          description: Generated quiz (answers are not included)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizRead"
        "202":
          description: AI generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyTaskStarted"
        "422":
          description: Invalid request, or no questions could be generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/LLMUnavailable"

  /api/classes/{class_id}/quizzes/{quiz_id}:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/QuizId"
    get:
      summary: Get a quiz without its answers
      operationId: getQuiz
      responses:
        "200":
          description: Quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizRead"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a quiz and its attempts
      operationId: deleteQuiz
      responses:
        "204":
          description: Deleted

  /api/classes/{class_id}/quizzes/{quiz_id}/attempts:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/QuizId"
    get:
      summary: List graded attempts, newest first
      operationId: listQuizAttempts
      responses:
        "200":
          description: Attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizAttemptRead"
    post:
      summary: Submit answers and get them graded
      operationId: submitQuizAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: object
                  description: >-
                    Keyed by question ID. Responses are {"choice": int} (mcq),
                    {"value": bool} (tf), {"pairs": [int]} (matching; index into
                    the right column for each left item), {"text": str} (fill,
                    short). Short answers are graded by the LLM when the quiz's
                    ai_grading setting is on; otherwise, or if the LLM fails,
                    they come back as needs_self_review.
                  additionalProperties:
                    type: object
      responses:
        "201":
          description: Graded attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAttemptRead"

  /api/classes/{class_id}/quizzes/{quiz_id}/attempts/{attempt_id}:
    parameters:
      - $ref: "#/components/parameters/ClassId"
      - $ref: "#/components/parameters/QuizId"
      - name: attempt_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Record the user's own verdict on short answers
      operationId: selfGradeQuizAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grades:
                  type: object
                  description: Question ID to correct (true) or wrong (false).
                  additionalProperties:
                    type: boolean
              required: [grades]
      responses:
        "200":
          description: Regraded attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAttemptRead"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    ClassId:
      name: class_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeckId:
      name: deck_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardId:
      name: card_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuizId:
      name: quiz_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    LLMUnavailable:
      description: LLM provider is unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: LLM provider is unavailable
              code:
                type: string
                example: LLM_UNAVAILABLE
            required: [detail, code]

  schemas:
    ProviderName:
      type: string
      enum: [copilot, copilot-ollama, anthropic, openai, ollama]

    WhisperModelSize:
      type: string
      enum:
        - tiny
        - base
        - small
        - medium
        - large-v1
        - large-v2
        - large-v3
        - distil-large-v2
        - distil-large-v3
        - turbo

    WhisperDevice:
      type: string
      enum: [cpu, cuda]

    SettingsRead:
      type: object
      properties:
        llm_provider:
          $ref: "#/components/schemas/ProviderName"
        llm_model:
          type: string
          nullable: true
        llm_models:
          type: object
          description: >-
            Saved model per provider (null means the provider default).
            Switching llm_provider restores that provider's entry into
            llm_model; ollama and copilot-ollama share one entry.
          additionalProperties:
            type: string
            nullable: true
        llm_temperature:
          type: number
          format: float
        llm_max_tokens:
          type: integer
        anthropic_api_key:
          type: string
          nullable: true
          description: Masked when configured; null when absent.
        openai_api_key:
          type: string
          nullable: true
          description: Masked when configured; null when absent.
        github_token:
          type: string
          nullable: true
          description: Masked when configured; null when absent.
        ollama_base_url:
          type: string
        whisper_model_size:
          $ref: "#/components/schemas/WhisperModelSize"
        whisper_device:
          $ref: "#/components/schemas/WhisperDevice"
      required:
        - llm_provider
        - llm_model
        - llm_models
        - llm_temperature
        - llm_max_tokens
        - anthropic_api_key
        - openai_api_key
        - github_token
        - ollama_base_url
        - whisper_model_size
        - whisper_device

    SettingsUpdate:
      type: object
      properties:
        llm_provider:
          $ref: "#/components/schemas/ProviderName"
        llm_model:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Model for the active provider (after any llm_provider change in
            the same request). Send an empty string to restore the provider
            default.
        llm_temperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
        llm_max_tokens:
          type: integer
          minimum: 1
          maximum: 1000000
        anthropic_api_key:
          type: string
          maxLength: 8192
          nullable: true
          description: Omit to preserve; send an empty string to delete.
        openai_api_key:
          type: string
          maxLength: 8192
          nullable: true
          description: Omit to preserve; send an empty string to delete.
        github_token:
          type: string
          maxLength: 8192
          nullable: true
          description: Omit to preserve; send an empty string to delete.
        ollama_base_url:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^https?://[^\s]+$'
        whisper_model_size:
          $ref: "#/components/schemas/WhisperModelSize"
        whisper_device:
          $ref: "#/components/schemas/WhisperDevice"

    ValidateKeyRequest:
      type: object
      properties:
        provider:
          $ref: "#/components/schemas/ProviderName"
        api_key:
          type: string
          maxLength: 8192
          nullable: true
          description: Omit to test the saved key; send an empty string to test without one.
        model:
          type: string
          maxLength: 255
          nullable: true
          description: Omit to test the provider's saved model; send an empty string for its default.
        ollama_base_url:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: '^https?://[^\s]+$'
          nullable: true
          description: Omit to test the saved Ollama server.
      required: [provider]

    ValidateKeyResponse:
      type: object
      properties:
        valid:
          type: boolean
        error:
          type: string
          nullable: true
          description: Plain-language reason the connection test failed.
      required: [valid]

    ModelUsage:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
      required: [input_tokens, output_tokens]

    UsageTotals:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        request_count:
          type: integer
        by_model:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ModelUsage"
      required: [input_tokens, output_tokens, request_count, by_model]

    OllamaUnloadResponse:
      type: object
      properties:
        unloaded:
          type: boolean
      required: [unloaded]

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
      required: [detail, code]

    ClassCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
      required: [name]

    ClassUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
        description:
          type: string
          maxLength: 4000
          nullable: true

    ClassRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, description, created_at, updated_at]

    FileType:
      type: string
      enum: [pdf, docx, pptx, xlsx, image, video, audio, markdown, other]

    FileStatus:
      type: string
      enum: [pending, processing, ready, error]

    FileRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        original_filename:
          type: string
        file_type:
          $ref: "#/components/schemas/FileType"
        file_size_bytes:
          type: integer
        raw_path:
          type: string
        converted_path:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/FileStatus"
        error_message:
          type: string
          nullable: true
        metadata_json:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ingesting:
          type: boolean
          description: Queued for or undergoing wiki ingestion (source summary not written yet).
      required:
        - id
        - class_id
        - original_filename
        - file_type
        - file_size_bytes
        - raw_path
        - status
        - created_at
        - updated_at

    FileUploadResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        original_filename:
          type: string
        status:
          $ref: "#/components/schemas/FileStatus"
      required: [id, class_id, original_filename, status]

    WikiCategory:
      type: string
      enum: [source-summary, concept, entity, synthesis, index, log]

    WikiPageRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        path:
          type: string
        title:
          type: string
        category:
          $ref: "#/components/schemas/WikiCategory"
        content:
          type: string
        source_file_ids:
          type: array
          items:
            type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - class_id
        - path
        - title
        - category
        - content
        - created_at
        - updated_at

    WikiPageUpdate:
      type: object
      properties:
        content:
          type: string
      required: [content]

    WikiTreeNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        title:
          type: string
        category:
          $ref: "#/components/schemas/WikiCategory"
        user_edited:
          type: boolean
        updated_at:
          type: string
          format: date-time
      required: [id, path, title, category, user_edited, updated_at]

    WikiSearchResult:
      type: object
      properties:
        page_id:
          type: string
          format: uuid
        path:
          type: string
        title:
          type: string
        snippet:
          type: string
        rank:
          type: number
      required: [page_id, path, title, snippet, rank]

    LintReport:
      type: object
      properties:
        success:
          type: boolean
        issues:
          type: array
          items:
            type: object
            properties:
              page_path:
                type: string
              severity:
                type: string
              message:
                type: string
            required: [page_path, severity, message]
        error:
          type: string
          nullable: true
      required: [success, issues]

    RebuildPreview:
      type: object
      properties:
        pages_to_create:
          type: array
          items:
            type: string
        pages_to_delete:
          type: array
          items:
            type: string
          description: >-
            Pages that will be regenerated. Those the rebuild does not write
            again are removed, unless their source fails to re-ingest.
        pages_preserved_user_edited:
          type: array
          items:
            type: string
        pages_preserved_synthesis:
          type: array
          items:
            type: string
        source_file_count:
          type: integer
        estimated_tokens:
          type: integer
      required:
        - pages_to_create
        - pages_to_delete
        - pages_preserved_user_edited
        - pages_preserved_synthesis
        - source_file_count
        - estimated_tokens

    TaskStarted:
      type: object
      properties:
        task_id:
          type: string
        status:
          type: string
          enum: [started]
      required: [task_id, status]

    TaskStatus:
      type: object
      properties:
        task_id:
          type: string
        operation:
          type: string
        class_id:
          type: string
        status:
          type: string
          enum: [running, completed, failed, cancelled]
        progress:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Null when progress cannot be estimated.
        error:
          type: string
          nullable: true
        result:
          type: object
          nullable: true
          description: >-
            What a completed task produced. Study generation sets kind
            (deck|quiz), id, name, and count.
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
      required: [task_id, operation, class_id, status, created_at]

    ImportResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        file_count:
          type: integer
        page_count:
          type: integer
        message_count:
          type: integer
      required: [id, name, file_count, page_count, message_count]

    ChatRole:
      type: string
      enum: [user, assistant, system]

    ChatMessageRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ChatRole"
        content:
          type: string
        command:
          type: string
          nullable: true
        metadata_json:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, class_id, role, content, created_at, updated_at]

    # --- Chat WebSocket protocol -------------------------------------------
    ChatWsMessage:
      description: Client -> server. A chat message or slash command.
      type: object
      properties:
        type:
          type: string
          enum: [message]
        content:
          type: string
      required: [type, content]

    ChatWsChunk:
      description: Server -> client. One streamed chunk of assistant reply.
      type: object
      properties:
        type:
          type: string
          enum: [chunk]
        content:
          type: string
      required: [type, content]

    ChatWsComplete:
      description: Server -> client. Assistant reply finished.
      type: object
      properties:
        type:
          type: string
          enum: [complete]
        message_id:
          type: string
          format: uuid
        content:
          description: Complete assistant text for non-streaming commands.
          type: string
          nullable: true
        citations:
          type: array
          items:
            type: object
        result:
          type: object
          nullable: true
      required: [type, message_id]

    ChatWsError:
      description: Server -> client. Error processing message/command.
      type: object
      properties:
        type:
          type: string
          enum: [error]
        message:
          type: string
        code:
          type: string
          nullable: true
      required: [type, message]

    ChatWsProgress:
      description: Server -> client. Progress for long-running operation.
      type: object
      properties:
        type:
          type: string
          enum: [progress]
        operation:
          type: string
        operation_id:
          type: string
        percent:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Null when progress cannot be estimated.
        message:
          type: string
      required: [type, operation, operation_id, percent, message]

    ChatWsCancel:
      description: Client -> server. Cancel a running operation.
      type: object
      properties:
        type:
          type: string
          enum: [cancel]
        operation_id:
          type: string
      required: [type, operation_id]

    StudyMethod:
      type: string
      enum: [heuristic, llm, hybrid]
      description: >-
        heuristic is offline; llm writes from the wiki pages; hybrid gives the
        LLM offline drafts (cards) or key facts (quizzes) to refine.

    StudyTaskStarted:
      type: object
      properties:
        task_id:
          type: string
        kind:
          type: string
          enum: [deck, quiz]
      required: [task_id, kind]

    CardType:
      type: string
      enum: [basic, cloze]

    QuestionType:
      type: string
      enum: [mcq, tf, matching, fill, short]

    StudyScope:
      type: object
      description: >-
        Which wiki pages to study. topic needs query (hybrid search), pages
        needs paths, file needs file_id (pages citing that source).
      properties:
        type:
          type: string
          enum: [class, topic, pages, file]
          default: class
        query:
          type: string
          maxLength: 500
        paths:
          type: array
          items:
            type: string
        file_id:
          type: string
          format: uuid

    DeckGenerateRequest:
      type: object
      properties:
        scope:
          $ref: "#/components/schemas/StudyScope"
        method:
          $ref: "#/components/schemas/StudyMethod"
        count:
          type: integer
          minimum: 1
          maximum: 500
          default: 30
        card_types:
          type: array
          items:
            $ref: "#/components/schemas/CardType"
          default: [basic, cloze]
        name:
          type: string
          maxLength: 255

    DeckCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
      required: [name]

    DeckUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string

    DeckRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        generation_method:
          $ref: "#/components/schemas/StudyMethod"
        scope_json:
          type: object
          nullable: true
        card_count:
          type: integer
        due_count:
          type: integer
        stale_count:
          type: integer
          description: Cards whose source wiki pages changed since generation.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, class_id, name, generation_method, card_count, due_count, stale_count]

    DeckRefreshResponse:
      type: object
      properties:
        updated:
          type: integer
        removed:
          type: integer
        remaining_stale:
          type: integer
      required: [updated, removed, remaining_stale]

    FlashcardCreate:
      type: object
      properties:
        card_type:
          $ref: "#/components/schemas/CardType"
        front:
          type: string
          description: For cloze cards, must contain a {{c1::answer}} deletion.
        back:
          type: string
      required: [front]

    FlashcardUpdate:
      type: object
      properties:
        front:
          type: string
        back:
          type: string
        acknowledge_changes:
          type: boolean
          default: false
          description: Accept the current wiki pages as the new baseline (clears stale).

    FlashcardRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deck_id:
          type: string
          format: uuid
        card_type:
          $ref: "#/components/schemas/CardType"
        front:
          type: string
        back:
          type: string
        origin:
          type: string
          enum: [heuristic, llm, user]
        page_paths:
          type: array
          items:
            type: string
        source_file_ids:
          type: array
          items:
            type: string
        stale:
          type: boolean
        ease:
          type: number
        interval_days:
          type: integer
        repetitions:
          type: integer
        lapses:
          type: integer
        due_at:
          type: string
          format: date-time
        last_reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, deck_id, card_type, front, back, origin, stale, due_at]

    QuizGenerateRequest:
      type: object
      properties:
        scope:
          $ref: "#/components/schemas/StudyScope"
        method:
          $ref: "#/components/schemas/StudyMethod"
        count:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        question_types:
          type: array
          description: short requires method llm or hybrid.
          items:
            $ref: "#/components/schemas/QuestionType"
          default: [mcq, tf, matching, fill]
        name:
          type: string
        seed:
          type: integer
          description: Fixes question selection and ordering; random when omitted.
        ai_grading:
          type: boolean
          default: true

    QuizQuestionRead:
      type: object
      description: >-
        choices is {"options": [str]} for mcq and {"left": [str], "right":
        [str]} for matching; null otherwise.
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        question_type:
          $ref: "#/components/schemas/QuestionType"
        prompt:
          type: string
        choices:
          type: object
          nullable: true
        page_paths:
          type: array
          items:
            type: string
        stale:
          type: boolean
      required: [id, position, question_type, prompt, stale]

    QuizSummaryRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        name:
          type: string
        generation_method:
          $ref: "#/components/schemas/StudyMethod"
        scope_json:
          type: object
          nullable: true
        settings_json:
          type: object
          nullable: true
        question_count:
          type: integer
        stale_count:
          type: integer
        attempt_count:
          type: integer
        last_score:
          type: number
          nullable: true
        last_max_score:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, class_id, name, question_count, stale_count, attempt_count]

    QuizRead:
      allOf:
        - $ref: "#/components/schemas/QuizSummaryRead"
        - type: object
          properties:
            questions:
              type: array
              items:
                $ref: "#/components/schemas/QuizQuestionRead"
          required: [questions]

    QuizAttemptRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        quiz_id:
          type: string
          format: uuid
        score:
          type: number
        max_score:
          type: number
        created_at:
          type: string
          format: date-time
        results:
          type: array
          items:
            type: object
            properties:
              question_id:
                type: string
                format: uuid
              score:
                type: number
                description: 0-1; matching gives partial credit.
              correct:
                type: boolean
                nullable: true
              status:
                type: string
                enum: [graded, unanswered, needs_self_review]
              response:
                type: object
                nullable: true
              expected:
                type: object
              explanation:
                type: string
                nullable: true
              feedback:
                type: string
                nullable: true
                description: AI grader's comment on a short answer.
              grader:
                type: string
                enum: [ai, self]
                nullable: true
                description: Who graded a short answer.
